[package]
name = "jadoo"
version = "1.0.11"
description = "Jadoo — batch video logo overlay desktop app"
authors = ["Zaheer Ahmad"]
repository = "https://github.com/dashingmza/jadoo"
edition = "2021"

[lib]
name = "jadoo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# "bundled" = apna khud ka SQLite compile kar leta hai (system mein
# libsqlite3 install hone ki zaroorat nahi — Windows/macOS/Linux CI sab pe
# bina extra apt-get/brew step ke chalta hai).
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
