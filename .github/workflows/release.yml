name: Release

# Ek git tag jo "v" se shuru ho (jaise v1.0.1) push karne pe ye workflow
# chalta hai — Windows/macOS/Linux teeno pe app build karta hai aur ek
# GitHub Release (draft) bana kar sab installers + updater artifacts
# (latest.json) attach kar deta hai.
#
# Trigger karne ka tareeka:
#   git tag v1.0.1
#   git push origin v1.0.1

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: pnpm install

      # ffmpeg/ffprobe GIT mein commit NAHI hain (GitHub ka 100MB/file limit
      # hai, ye files ~130MB each hain) — ye step khud, is matrix leg ke
      # actual target (TARGET_TRIPLE) ke mutabiq, sahi binaries download kar
      # leta hai. Verified source: descriptinc/ffmpeg-ffprobe-static.
      - name: Download ffmpeg/ffprobe for this target
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-ffmpeg.mjs

      # Ab plain-named files (ffmpeg.exe/ffmpeg) ko Tauri sidecar ke required
      # naam (target-triple suffix wala) pe copy karo.
      - name: Prepare ffmpeg/ffprobe sidecars
        run: node scripts/prepare-ffmpeg.mjs

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Jadoo ${{ github.ref_name }}"
          releaseBody: "Downloads neeche hain — apne OS ke hisaab se sahi file le lo."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
