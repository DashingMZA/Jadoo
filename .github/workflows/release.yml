name: Release

# Pushing a git tag that starts with "v" (for example v1.1.11) runs this
# workflow — it builds the Windows app and creates a GitHub Release
# (draft) with the installer, the updater artifacts (latest.json) and
# the portable ZIP attached.
#
# How to trigger it:
#   git tag v1.1.11
#   git push origin v1.1.11
#
# Windows only: this app targets Windows (bundle targets: ["nsis"] in
# src-tauri/tauri.conf.json), matching the upstream releases, which ship
# a Windows installer and a portable ZIP only.
#
# Important GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY=(your private key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD=(your password)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Required to create the release and upload assets, otherwise
# tauri-action fails with a permission error such as
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install pnpm BEFORE setup-node — setup-node's pnpm cache option
      # (below) looks for an already-available pnpm executable.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # No `version:` input here: package.json already pins the pnpm
        # version via `packageManager`, and pnpm/action-setup v6 errors
        # out when both are set ("Multiple versions of pnpm specified").
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Verify Node and pnpm
        run: |
          node --version
          pnpm --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Is matrix leg ka EXACT target install karo (zaroori hai — warna
      # macOS Intel cross-compile leg Apple-Silicon runner pe fail hoti hai,
      # kyunke cargo ke paas wo target hi installed nahi hota).
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Verify Rust target
        run: |
          rustc --version
          rustup target list --installed

      # NOTE: libappindicator3-dev aur libayatana-appindicator3-dev ek dusre
      # ko "Conflicts" karte hain (ayatana naye wala, Ubuntu 22.04+ pe isi
      # ko use karna hai) — dono ek sath install nahi ho sakte, sirf
      # ayatana wala rakha hai.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ffmpeg/ffprobe GIT mein commit NAHI hain (GitHub ka 100MB/file limit
      # hai, ye files ~130MB each hain) — ye step khud, is matrix leg ke
      # actual target (TARGET_TRIPLE) ke mutabiq, sahi binaries download kar
      # leta hai. Verified source: descriptinc/ffmpeg-ffprobe-static.
      - name: Download ffmpeg/ffprobe for this target
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-ffmpeg.mjs

      # Ab plain-named files (ffmpeg.exe/ffmpeg) ko Tauri sidecar ke required
      # naam (target-triple suffix wala) pe copy karo. TARGET_TRIPLE yahan
      # bhi zaroori hai (same cross-compile reason jaisa upar).
      - name: Prepare ffmpeg/ffprobe sidecars
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: node scripts/prepare-ffmpeg.mjs

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Jadoo ${{ github.ref_name }}"
          releaseBody: "Downloads neeche hain — apne OS ke hisaab se sahi file le lo."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
