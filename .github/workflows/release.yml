name: Release

# Git tag jo "v" se shuru ho (jaise v1.0.1) push karne par
# Windows/macOS builds aur GitHub Draft Release create hoti hai.
#
# Trigger:
#   git tag v1.0.1
#   git push origin v1.0.1

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false

      matrix:
        include:
          # macOS Apple Silicon
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"

          # macOS Intel
          - platform: "macos-26"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"

          # Windows 10/11 x64
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package.json:
      # "packageManager": "pnpm@12.4.2"
      #
      # Version intentionally yahan specify nahi ki gayi.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # pnpm ko setup-node se pehle install karna zaroori hai
      # because setup-node ka pnpm cache pnpm executable use karta hai.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify Node and pnpm
        run: |
          node --version
          pnpm --version

      # Install Rust stable toolchain.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Explicitly install the exact target required by this matrix leg.
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Verify Rust target
        run: |
          rustc --version
          rustup target list --installed

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Download FFmpeg/FFprobe according to the Rust target triple.
      #
      # aarch64-apple-darwin -> darwin-arm64
      # x86_64-apple-darwin  -> darwin-x64
      # x86_64-pc-windows-msvc -> win32-x64
      - name: Download ffmpeg/ffprobe for this target
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-ffmpeg.mjs

      # Rename/copy the plain FFmpeg binaries using Tauri's
      # target-triple sidecar naming convention.
      - name: Prepare ffmpeg/ffprobe sidecars
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: node scripts/prepare-ffmpeg.mjs

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Jadoo ${{ github.ref_name }}"
          releaseBody: |
            Jadoo ${{ github.ref_name }}

            Downloads:
            - Windows 10/11 x64
            - macOS Apple Silicon
            - macOS Intel

            Choose the installer for your operating system and architecture.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}