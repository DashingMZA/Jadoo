name: Release

# Release targets:
# - Windows 10/11 x64
# - macOS Apple Silicon
# - macOS Intel
# - Ubuntu 22.04 / 24.04 / 26.04
#
# A git tag beginning with "v" triggers the release.
#
# Example:
#   git tag v1.0.1
#   git push origin v1.0.1

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false

      matrix:
        include:
          # macOS Apple Silicon
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
            publish: true

          # macOS Intel
          - platform: "macos-26"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
            publish: true

          # Ubuntu 22.04 - publish Linux artifact
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
            publish: true

          # Ubuntu 24.04 - build validation
          - platform: "ubuntu-24.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
            publish: false

          # Ubuntu 26.04 - build validation
          - platform: "ubuntu-26.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
            publish: false

          # Windows 10/11 x64
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc"
            publish: true

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # IMPORTANT:
      # pnpm must be installed BEFORE setup-node because setup-node
      # uses pnpm for its dependency cache.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Verify Node and pnpm
        run: |
          node --version
          pnpm --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Install macOS build dependencies
        if: startsWith(matrix.platform, 'macos-')
        run: |
          brew install llvm || true

      - name: Install Windows target
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: rustup target add $env:TARGET_TRIPLE
        env:
          TARGET_TRIPLE: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Download the correct FFmpeg/FFprobe binaries according to
      # the Rust target triple.
      #
      # fetch-ffmpeg.mjs maps:
      #   aarch64-apple-darwin      -> darwin-arm64
      #   x86_64-apple-darwin       -> darwin-x64
      #   x86_64-pc-windows-msvc    -> win32-x64
      #   x86_64-unknown-linux-gnu  -> linux-x64
      - name: Download ffmpeg/ffprobe for this target
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-ffmpeg.mjs

      # Create Tauri sidecar filenames:
      #   ffmpeg-<target-triple>
      #   ffprobe-<target-triple>
      #
      # IMPORTANT:
      # TARGET_TRIPLE is passed explicitly so cross-compilation does
      # not accidentally use the runner's host architecture.
      - name: Prepare ffmpeg/ffprobe sidecars
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: node scripts/prepare-ffmpeg.mjs

      # Publish only the release-producing matrix legs.
      - name: Build and release
        if: matrix.publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Jadoo ${{ github.ref_name }}"
          releaseBody: |
            Jadoo ${{ github.ref_name }}

            Downloads:
            - Windows 10/11 x64
            - macOS Apple Silicon
            - macOS Intel
            - Ubuntu Linux

            Choose the installer for your operating system and architecture.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Ubuntu 24/26 are compiled for validation only.
      # They do not upload duplicate Linux artifacts.
      - name: Build validation only
        if: ${{ !matrix.publish }}
        run: pnpm tauri build ${{ matrix.args }}
